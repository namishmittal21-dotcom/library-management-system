<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>My Borrowings</title><link rel="stylesheet" href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <h3>My Borrowings</h3>
    <div th:if="${success}" class="alert alert-success">[[${success}]]</div>
    <div th:if="${error}" class="alert alert-danger">[[${error}]]</div>
    <table class="table table-bordered">
        <thead class="table-dark">
        <tr><th>Book</th><th>Issue Date</th><th>Due Date</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody>
            <tr th:each="b : ${borrowings}">
                <td th:text="${b.book.title}"></td>
                <td th:text="${b.issueDate}"></td>
                <td th:text="${b.dueDate}"></td>
                <td>
                    <!-- Convert LocalDateTime to LocalDate before comparing -->
                    <span th:if="${#temporals.createNow().toLocalDate().isBefore(b.dueDate)}" class="badge bg-success">Active</span>
                    <span th:unless="${#temporals.createNow().toLocalDate().isBefore(b.dueDate)}" class="badge bg-danger">Overdue</span>
                </td>
                <td>
                    <form th:action="@{/user/return/{id}(id=${b.id})}" method="post">
                        <button class="btn btn-sm btn-warning">Return</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
