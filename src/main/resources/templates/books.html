<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Manage Books</title><link rel="stylesheet" href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <h3>Books</h3>
    <div th:if="${success}" class="alert alert-success">[[${success}]]</div>
    <div class="card mb-3"><div class="card-body">
        <form th:action="@{/admin/books/save}" th:object="${newBook}" method="post" class="row">
            <div class="col"><input th:field="*{title}" placeholder="Title" class="form-control"></div>
            <div class="col"><input th:field="*{author}" placeholder="Author" class="form-control"></div>
            <div class="col"><input th:field="*{isbn}" placeholder="ISBN" class="form-control"></div>
            <div class="col"><input th:field="*{barcode}" placeholder="Barcode" class="form-control"></div>
            <div class="col"><button class="btn btn-primary">Add</button></div>
        </form>
    </div></div>
    <table class="table table-bordered">
        <thead class="table-dark"><tr><th>ID</th><th>Title</th><th>Author</th><th>Barcode</th><th>Available</th><th>Action</th></tr></thead>
        <tbody><tr th:each="b : ${books}"><td th:text="${b.id}"></td><td th:text="${b.title}"></td><td th:text="${b.author}"></td><td th:text="${b.barcode}"></td><td th:text="${b.available} ? 'Yes' : 'No'"></td><td><a th:href="@{/admin/books/delete/{id}(id=${b.id})}" class="btn btn-sm btn-danger">Delete</a></td></tr></tbody>
    </table>
</div>
</body>
</html>
