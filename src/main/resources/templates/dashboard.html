<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <h2>Dashboard</h2>
    <div class="row">
        <div class="col-md-3"><div class="card text-white bg-primary mb-3"><div class="card-body"><i class="fas fa-book"></i> Total Books<br><span class="display-4" th:text="${totalBooks}">0</span></div></div></div>
        <div class="col-md-3"><div class="card text-white bg-success mb-3"><div class="card-body"><i class="fas fa-users"></i> Members<br><span class="display-4" th:text="${totalMembers}">0</span></div></div></div>
        <div class="col-md-3"><div class="card text-white bg-warning mb-3"><div class="card-body"><i class="fas fa-hand-holding"></i> Books Issued<br><span class="display-4" th:text="${booksIssued}">0</span></div></div></div>
        <div class="col-md-3"><div class="card text-white bg-danger mb-3"><div class="card-body"><i class="fas fa-clock"></i> Overdue<br><span class="display-4" th:text="${overdueBooks}">0</span></div></div></div>
    </div>
</div>
</body>
</html>
